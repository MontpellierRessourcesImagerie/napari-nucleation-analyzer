name: napari-nucleation-analyzer
display_name: Nucleation analyzer
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: napari-nucleation-analyzer.nucleation_widget
      python_name: napari_nucleation_analyzer.widget:CentrosomePairsWidget
      title: Nucleation analyzer
    - id: napari-nucleation-analyzer.import_archive
      python_name: napari_nucleation_analyzer._reader:napari_get_reader
      title: Import archive
  readers:
    - command: napari-nucleation-analyzer.import_archive
      accepts_directories: false
      filename_patterns: ['*.zip']
  widgets:
    - command: napari-nucleation-analyzer.nucleation_widget
      display_name: Nucleation analyzer
  